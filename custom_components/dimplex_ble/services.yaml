get_gatt_services:
  fields:
    device_id:
      required: true
      example: "device-registry-id"
      selector:
        device:
          integration: dimplex_ble
read_gatt:
  fields:
    device_id:
      required: true
      example: "device-registry-id"
      selector:
        device:
          integration: dimplex_ble
    service_group:
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 3
          mode: box
    characteristic:
      required: true
      example: 4131
      selector:
        number:
          min: 0
          max: 65535
          mode: box
write_gatt:
  fields:
    device_id:
      required: true
      example: "device-registry-id"
      selector:
        device:
          integration: dimplex_ble
    service_group:
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 3
          mode: box
    characteristic:
      required: true
      example: 4131
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    payload:
      required: true
      example: "1500"
      selector:
        text:
