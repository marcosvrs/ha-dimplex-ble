minimum_pre_commit_version: "4.7.0"
default_install_hook_types:
  - pre-commit
  - pre-push
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
        exclude: ^esphome_proxy\.yaml$
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: .venv/bin/ruff check
        language: system
        types_or: [python, pyi]
      - id: strict-mypy
        name: Strict mypy
        entry: .venv/bin/mypy
        language: system
        pass_filenames: false
        files: ^custom_components/dimplex_ble/.*\.py$
        types: [python]
      - id: full-quality-gates
        name: Full quality gates
        entry: bash scripts/run_quality_gates.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
