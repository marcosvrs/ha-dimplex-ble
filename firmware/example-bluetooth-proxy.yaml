# ESPHome Bluetooth proxy for Dimplex heaters (stock ESPHome >= 2026.11.0).
substitutions:
  name: living-room-bluetooth-proxy
  friendly_name: Living Room Bluetooth Proxy

packages:
  # Keep dimplex_pin_responder.yaml in the same folder as this file.
  dimplex_pin_responder: !include dimplex_pin_responder.yaml
  # Pinned commit of esphome/bluetooth-proxies (no tag exists for ESPHome 2026.11).
  esphome.bluetooth-proxy: "github://esphome/bluetooth-proxies/esp32-generic/esp32-generic-s3.yaml@da95a91b1c1d691736df5e676f1d2a3324f28bc4"

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

api:
  encryption:
    key: !secret living_room_api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_ble:
  # The heaters pair with a 6-digit passkey that HA answers for the proxy.
  io_capability: keyboard_only
  auth_req_mode: sc_mitm_bond
  # 3 proxy connection slots + 1 for the PIN responder.
  max_connections: 4
