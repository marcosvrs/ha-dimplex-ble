packages:
  # Pinned: esphome/bluetooth-proxies has no tag for ESPHome 2026.11.
  bluetooth_proxy: github://esphome/bluetooth-proxies/esp32-generic/esp32-generic-s3.yaml@da95a91b1c1d691736df5e676f1d2a3324f28bc4
  # Last, so its settings win over the stock proxy's.
  dimplex_pin_responder: !include dimplex_pin_responder.yaml

# dimplex_pin_arm carries the heater PIN: the API must be encrypted.
api:
  encryption:
    key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
