# Dimplex PIN responder: answers a heater's 6-digit passkey request with the PIN
# Home Assistant sends just before it pairs (docs/esphome-ble-findings.md).
# The device needs esp32_ble io_capability: keyboard_only and max_connections: 4.
# The PIN stays in RAM and is never logged; 1000000 means "disarmed".

esphome:
  # First release whose default ESP-IDF keeps the heater bond after a failed
  # re-encryption.
  min_version: 2026.11.0

globals:
  - id: dimplex_pin
    type: int
    restore_value: no
    initial_value: "1000000"
  - id: dimplex_pin_set_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

ble_client:
  - id: dimplex_pin_client
    mac_address: "00:00:00:00:00:00" # retargeted by dimplex_pin_arm
    auto_connect: false
    on_passkey_request:
      # Tells HA the heater shows its PIN now (the event carries no PIN).
      - homeassistant.event:
          event: esphome.dimplex_passkey_request
          data:
            address: !lambda "return std::string(id(dimplex_pin_client).address_str());"
      - wait_until:
          condition:
            lambda: "return id(dimplex_pin) <= 999999;"
          timeout: 25s # below the 30 s SMP response timer
      # Answer only with a PIN armed in the last 3 minutes.
      - if:
          condition:
            lambda: "return id(dimplex_pin) <= 999999 && (millis() - id(dimplex_pin_set_ms)) < 180000;"
          then:
            - ble_client.passkey_reply:
                id: dimplex_pin_client
                passkey: !lambda "return id(dimplex_pin);"

api:
  actions:
    # address: 12 hex digits, optionally separated by ':' or '-'.
    # passkey: 0..999999, or 1000000 = "set the target only, the PIN follows".
    - action: dimplex_pin_arm
      variables:
        address: string
        passkey: int
      then:
        - lambda: |-
            uint64_t a = 0;
            int digits = 0;
            for (char c : address) {
              if (c == ':' || c == '-') continue;
              int v;
              if (c >= '0' && c <= '9') v = c - '0';
              else if (c >= 'a' && c <= 'f') v = c - 'a' + 10;
              else if (c >= 'A' && c <= 'F') v = c - 'A' + 10;
              else { digits = -1; break; }
              a = (a << 4) | (uint64_t) v;
              digits++;
            }
            if (digits != 12) {
              id(dimplex_pin) = 1000000;
              return;
            }
            id(dimplex_pin_client).set_address(a);
            id(dimplex_pin) = (passkey >= 0 && passkey <= 999999) ? passkey : 1000000;
            id(dimplex_pin_set_ms) = millis();

    # Disarm and detach (set_address(0) is what the stock client does itself).
    - action: dimplex_pin_clear
      then:
        - lambda: |-
            id(dimplex_pin) = 1000000;
            id(dimplex_pin_set_ms) = 0;
            id(dimplex_pin_client).set_address(0);
