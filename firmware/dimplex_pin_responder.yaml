# Dimplex PIN responder (stock ESPHome 2026.11, no external component).
# Spec: docs/investigation-2026-11-24/design-addendum.md section A.
#
# Include from a device file with:
#   packages:
#     dimplex_pin_responder: !include dimplex_pin_responder.yaml
# (path relative to the device file; example-bluetooth-proxy.yaml keeps both
# files in the same folder).
# The device must set esp32_ble.max_connections: 4 (3 proxy slots + 1 responder)
# and esp32_ble.io_capability: keyboard_only.
#
# The PIN lives only in RAM (globals, restore_value: no) and is never logged.
# 1000000 means "disarmed": ble_client.passkey_reply is a no-op for values > 999999.

globals:
  - id: dimplex_pin
    type: int
    restore_value: no
    initial_value: "1000000"
  - id: dimplex_pin_set_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

ble_client:
  - id: dimplex_pin_client
    mac_address: "00:00:00:00:00:00" # placeholder, retargeted by dimplex_pin_arm
    auto_connect: false
    on_connect:
      - logger.log:
          level: WARN
          format: "dimplex_pin_client: unexpected on_connect (auto_connect is false)"
    on_disconnect:
      - logger.log:
          level: WARN
          format: "dimplex_pin_client: unexpected on_disconnect (auto_connect is false)"
    on_passkey_request:
      # Tells HA the heater now shows its PIN (no PIN in the event).
      # HA forwards esphome.* events without "allow actions" (esphome/manager.py).
      - homeassistant.event:
          event: esphome.dimplex_passkey_request
          data:
            address: !lambda "return std::string(id(dimplex_pin_client).address_str());"
      - wait_until:
          condition:
            lambda: "return id(dimplex_pin) <= 999999;"
          timeout: 25s # below the 30 s SMP response timer
      - if:
          condition:
            lambda: "return id(dimplex_pin) <= 999999 && (millis() - id(dimplex_pin_set_ms)) < 180000;"
          then:
            - ble_client.passkey_reply:
                id: dimplex_pin_client
                passkey: !lambda "return id(dimplex_pin);"
            - logger.log:
                level: INFO
                format: "dimplex_pin_client: passkey request answered for %s"
                args: ["id(dimplex_pin_client).address_str()"]
          else:
            - logger.log:
                level: WARN
                format: "dimplex_pin_client: passkey request not answered: responder not armed"

api:
  actions:
    # address: 12 hex digits, optionally separated by ':' or '-'.
    # passkey: 0..999999, or 1000000 = "set target only, PIN follows".
    - action: dimplex_pin_arm
      variables:
        address: string
        passkey: int
      then:
        - lambda: |-
            uint64_t a = 0;
            int digits = 0;
            bool ok = true;
            for (char c : address) {
              if (c == ':' || c == '-') continue;
              int v;
              if (c >= '0' && c <= '9') v = c - '0';
              else if (c >= 'a' && c <= 'f') v = c - 'a' + 10;
              else if (c >= 'A' && c <= 'F') v = c - 'A' + 10;
              else { ok = false; break; }
              a = (a << 4) | (uint64_t) v;
              digits++;
            }
            if (!ok || digits != 12) {
              id(dimplex_pin) = 1000000;
              ESP_LOGW("dimplex_pin", "arm rejected: invalid address '%s'", address.c_str());
              return;
            }
            bool present = passkey >= 0 && passkey <= 999999;
            id(dimplex_pin_client).set_address(a);
            id(dimplex_pin) = present ? passkey : 1000000;
            id(dimplex_pin_set_ms) = millis();
            ESP_LOGI("dimplex_pin", "armed address=%02X:%02X:%02X:%02X:%02X:%02X pin_present=%s",
                     (unsigned) ((a >> 40) & 0xFF), (unsigned) ((a >> 32) & 0xFF),
                     (unsigned) ((a >> 24) & 0xFF), (unsigned) ((a >> 16) & 0xFF),
                     (unsigned) ((a >> 8) & 0xFF), (unsigned) (a & 0xFF), present ? "yes" : "no");

    # Disarms and detaches the responder. set_address(0) is safe: the stock client
    # does the same itself (ble_client_base.cpp:216), parse_device() ignores
    # address 0 (ble_client_base.cpp:107) and auto_connect is false.
    - action: dimplex_pin_clear
      then:
        - lambda: |-
            id(dimplex_pin) = 1000000;
            id(dimplex_pin_set_ms) = 0;
            id(dimplex_pin_client).set_address(0);
            ESP_LOGI("dimplex_pin", "cleared");
