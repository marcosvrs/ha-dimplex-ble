# Answers a heater's passkey request with the PIN Home Assistant arms just
# before pairing. The PIN stays in RAM, is never logged, and 1000000 means
# disarmed (docs/technical/architecture.md).

esphome:
  # First release that keeps the heater bond after a failed re-encryption.
  min_version: 2026.11.0

esp32_ble:
  io_capability: keyboard_only # the heater shows the PIN; the proxy types it
  max_connections: 4 # 3 proxy slots + this ble_client

# Firmware uploads must use the API key: a plaintext upload could replace the
# firmware and capture the PINs. ota_esphome is the stock proxy's OTA.
ota:
  - id: !extend ota_esphome
    encryption: {}

globals:
  - id: dimplex_pin
    type: int
    initial_value: "1000000"
  - id: dimplex_pin_set_ms
    type: uint32_t

ble_client:
  - id: dimplex_pin_client
    mac_address: "00:00:00:00:00:00" # set by dimplex_pin_arm
    auto_connect: false
    on_passkey_request:
      - homeassistant.event:
          event: esphome.dimplex_passkey_request
          data:
            address: !lambda "return std::string(id(dimplex_pin_client).address_str());"
      - wait_until:
          condition:
            lambda: "return id(dimplex_pin) <= 999999;"
          timeout: 25s # below the 30 s pairing timeout
      # Only a PIN armed in the last 3 minutes.
      - if:
          condition:
            lambda: "return id(dimplex_pin) <= 999999 && millis() - id(dimplex_pin_set_ms) < 180000;"
          then:
            - ble_client.passkey_reply:
                id: dimplex_pin_client
                passkey: !lambda "return id(dimplex_pin);"

api:
  actions:
    # address: AA:BB:CC:DD:EE:FF. passkey: 0-999999, or 1000000 to set the
    # target first and send the PIN in a second call.
    - action: dimplex_pin_arm
      variables:
        address: string
        passkey: int
      then:
        - lambda: |-
            uint64_t a = 0;
            int digits = 0;
            for (char c : address) {
              if (c == ':') continue;
              if (c >= '0' && c <= '9') a = (a << 4) | (c - '0');
              else if (c >= 'A' && c <= 'F') a = (a << 4) | (c - 'A' + 10);
              else break;
              digits++;
            }
            if (digits != 12 || address.size() != 17) {
              id(dimplex_pin) = 1000000;
              return;
            }
            id(dimplex_pin_client).set_address(a);
            id(dimplex_pin) = passkey >= 0 && passkey <= 999999 ? passkey : 1000000;
            id(dimplex_pin_set_ms) = millis();

    - action: dimplex_pin_clear
      then:
        - lambda: |-
            id(dimplex_pin) = 1000000;
            id(dimplex_pin_client).set_address(0);
