name: CI

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  quality:
    name: Tests, strict typing, and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - name: Install test dependencies
        run: |
          uv venv --python 3.14
          uv pip install --python .venv/bin/python -r requirements-test.txt
      - name: Check Ruff formatting
        run: .venv/bin/ruff format --check custom_components/dimplex_ble
      - name: Run quality gates
        run: bash scripts/run_quality_gates.sh

  hassfest:
    name: Home Assistant manifest validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@9e9565e68f5a70d874202871f4c4064d23814235 # master

